<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Outer Card Frame -->
  <rect x="2" y="2" width="60" height="60" rx="4" fill="#FFFFFF" stroke="#0D436B" stroke-width="2"/>
  
  <!-- Main Plot Area Canvas -->
  <rect x="8" y="8" width="48" height="33" fill="#EDF4FC" stroke="#767777" stroke-width="1"/>
  
  <!-- Major Vertical Factor Separation Line -->
  <line x1="32" y1="8" x2="32" y2="55" stroke="#0D436B" stroke-width="1.2" stroke-dasharray="3 1.5"/>
  
  <!-- Sub-level Mean Lines (Whirlpool Accent Blue) -->
  <line x1="11" y1="21" x2="29" y2="21" stroke="#00A0DD" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="35" y1="31" x2="53" y2="31" stroke="#00A0DD" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Scatter Data Points (Subgroup 1) -->
  <circle cx="14" cy="16" r="1.8" fill="#C00000"/>
  <circle cx="20" cy="25" r="1.8" fill="#C00000"/>
  <circle cx="26" cy="19" r="1.8" fill="#C00000"/>
  
  <!-- Scatter Data Points (Subgroup 2) -->
  <circle cx="38" cy="35" r="1.8" fill="#C00000"/>
  <circle cx="44" cy="27" r="1.8" fill="#C00000"/>
  <circle cx="50" cy="33" r="1.8" fill="#C00000"/>
  
  <!-- Bottom Design Table Container -->
  <rect x="8" y="41" width="48" height="14" fill="#FFFFFF" stroke="#767777" stroke-width="1"/>
  
  <!-- Table Horizontal Grid Line -->
  <line x1="8" y1="48" x2="56" y2="48" stroke="#767777" stroke-width="0.8"/>
  
  <!-- Table Vertical Grid Dividers -->
  <line x1="20" y1="41" x2="20" y2="48" stroke="#9FA0A1" stroke-width="0.8"/>
  <line x1="44" y1="41" x2="44" y2="48" stroke="#9FA0A1" stroke-width="0.8"/>
  
  <!-- Abstract Factor Level Label Indicators -->
  <rect x="12" y="44" width="4" height="1.5" rx="0.5" fill="#484949"/>
  <rect x="24" y="44" width="4" height="1.5" rx="0.5" fill="#484949"/>
  <rect x="36" y="44" width="4" height="1.5" rx="0.5" fill="#484949"/>
  <rect x="48" y="44" width="4" height="1.5" rx="0.5" fill="#484949"/>
  
  <!-- Top-Level Factor Header Bars -->
  <rect x="14" y="51" width="12" height="2" rx="0.5" fill="#0D436B"/>
  <rect x="38" y="51" width="12" height="2" rx="0.5" fill="#0D436B"/>
</svg>
